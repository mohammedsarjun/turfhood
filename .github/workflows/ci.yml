name: CI

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

jobs:
  lint-check:
    name: Lint Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Frontend Lint Check
        run: npm run lint --workspace=frontend

      - name: Backend Lint Check
        run: npm run lint --workspace=backend

  unit-and-integration-check:
    name: Unit and Integration Tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://localhost:27017/turfhood_test
      JWT_SECRET: test-only-jwt-secret
      REFRESH_TOKEN_SECRET: test-only-refresh-secret
      RESEND_API_KEY: test-placeholder
      GOOGLE_CLIENT_ID: test-placeholder
      GOOGLE_CLIENT_SECRET: test-placeholder
      CLOUDINARY_CLOUD_NAME: test-placeholder
      CLOUDINARY_API_KEY: test-placeholder
      CLOUDINARY_API_SECRET: test-placeholder
      CSC_API_KEY: test-placeholder
      ADMIN_EMAIL: admin@test.local
      ADMIN_PASSWORD: test-only-password
      PAYU_MERCHANT_KEY: test-placeholder
      PAYU_MERCHANT_SALT: test-placeholder

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Frontend Tests
        run: npm run test --workspace=frontend

      - name: Backend Tests
        run: npm run test --workspace=backend

  build-check:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Frontend Build
        run: npm run build --workspace=frontend

      - name: Backend Build
        run: npm run build --workspace=backend
