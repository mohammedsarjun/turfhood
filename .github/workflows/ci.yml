name: CI

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

jobs:
  lint-check:
    name: Lint Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Frontend Lint Check
        run: npm run lint --workspace=frontend

      - name: Backend Lint Check
        run: npm run lint --workspace=backend

  unit-and-integration-check:
    name: Unit and Integration Tests
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      MONGODB_URI: ${{ secrets.MONGO_URI }}
      JWT_SECRET: test-only-jwt-secret
      REFRESH_TOKEN_SECRET: test-only-refresh-secret
      RESEND_API_KEY: test-placeholder
      GOOGLE_CLIENT_ID: test-placeholder
      GOOGLE_CLIENT_SECRET: test-placeholder
      CLOUDINARY_CLOUD_NAME: test-placeholder
      CLOUDINARY_API_KEY: test-placeholder
      CLOUDINARY_API_SECRET: test-placeholder
      CSC_API_KEY: test-placeholder
      ADMIN_EMAIL: admin@test.local
      ADMIN_PASSWORD: test-only-password

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Frontend Tests
        run: npm run test --workspace=frontend

      - name: Backend Tests
        run: npm run test --workspace=backend

  build-check:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Frontend Build
        run: npm run build --workspace=frontend

      - name: Backend Build
        run: npm run build --workspace=backend